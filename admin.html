<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FLIRT X Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f6f8;
}

.box{
max-width:430px;
margin:50px auto;
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
margin-top:0;
}

label{
display:block;
font-size:14px;
font-weight:bold;
margin-top:18px;
}

input{
width:100%;
padding:14px;
margin-top:7px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:22px;
border:0;
border-radius:9px;
background:#1769d1;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.note{
font-size:13px;
color:#777;
line-height:1.5;
}

.status{
margin-top:18px;
font-size:14px;
line-height:1.5;
}

</style>

</head>


<body>

<div class="box">

<h1>FLIRT X Admin</h1>

<p class="note">
Use this panel to update the FLIRT X download link.
Your GitHub token is used only in this browser session
and is not stored in the page.
</p>


<label>
GitHub Username
</label>

<input
id="user"
type="text"
placeholder="your-username"
>


<label>
Repository Name
</label>

<input
id="repo"
type="text"
placeholder="flirt-x"
>


<label>
Fine-grained Personal Access Token
</label>

<input
id="token"
type="password"
placeholder="github_pat_..."
>


<label>
New Download Link
</label>

<input
id="link"
type="url"
placeholder="https://example.com/app.apk"
>


<button onclick="updateLink()">
UPDATE DOWNLOAD LINK
</button>


<div
id="status"
class="status">
</div>

</div>


<script>

async function updateLink(){

const user =
document.getElementById("user").value.trim();

const repo =
document.getElementById("repo").value.trim();

const token =
document.getElementById("token").value.trim();

const link =
document.getElementById("link").value.trim();

const status =
document.getElementById("status");


if(!user || !repo || !token || !link){

status.innerHTML =
"❌ Please fill all fields.";

return;

}


if(!/^https?:\/\//i.test(link)){

status.innerHTML =
"❌ Download link must start with http:// or https://";

return;

}


status.innerHTML =
"⏳ Updating GitHub...";


try{


/*
GitHub API URL
*/

const api =
"https://api.github.com/repos/" +
encodeURIComponent(user) +
"/" +
encodeURIComponent(repo) +
"/contents/config.json";


/*
Get existing config.json
*/

const getResponse =
await fetch(api,{

headers:{

"Authorization":
"Bearer " + token,

"Accept":
"application/vnd.github+json"

}

});


if(!getResponse.ok){

throw new Error(
"Repository/config.json not found, or token permission is incorrect."
);

}


const oldFile =
await getResponse.json();


/*
New config
*/

const newConfig = {

downloadUrl: link

};


/*
Convert JSON to Base64
*/

const jsonText =
JSON.stringify(newConfig,null,2);

const content =
btoa(
unescape(
encodeURIComponent(jsonText)
)
);


/*
Update GitHub file
*/

const putResponse =
await fetch(api,{

method:"PUT",

headers:{

"Authorization":
"Bearer " + token,

"Accept":
"application/vnd.github+json",

"Content-Type":
"application/json"

},

body:JSON.stringify({

message:
"Update FLIRT X download link",

content:content,

sha:oldFile.sha

})

});


if(!putResponse.ok){

const error =
await putResponse.json();

throw new Error(
error.message || "GitHub update failed."
);

}


status.innerHTML =
"✅ Download link successfully updated!<br><br>" +
"GitHub Pages ko update hone me thoda time lag sakta hai.";

}
catch(error){

status.innerHTML =
"❌ " + error.message;

}

}

</script>

</body>

</html>
